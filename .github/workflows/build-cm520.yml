name: Build CM520

on:
  workflow_dispatch:
    inputs:
      config_url:
        description: 'Optional HTTPS URL of .config (overrides the CM520 default)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-firmware.yml
    with:
      device: cm520
      config_url: ${{ inputs.config_url }}
