name: Build BE6L Pro (validation)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable SSH debug session'
        required: false
        type: boolean
        default: false
      config_url:
        description: 'Optional raw URL of .config (takes priority over repository .config)'
        required: false
        type: string
        default: ''
  repository_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-firmware.yml
    with:
      device: be6l-pro
      config_url: ${{ inputs.config_url || '' }}
      ssh: ${{ inputs.ssh == true }}
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
