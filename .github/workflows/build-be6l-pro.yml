name: Build BE6L Pro

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Firmware architecture (ARM64 is experimental)'
        type: choice
        options:
          - arm64
          - arm32
        default: arm64
      config_url:
        description: 'Optional HTTPS URL of .config (overrides the BE6L Pro default)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-firmware.yml
    with:
      device: ${{ inputs.architecture == 'arm64' && 'be6l-pro-arm64' || 'be6l-pro' }}
      config_url: ${{ inputs.config_url }}
