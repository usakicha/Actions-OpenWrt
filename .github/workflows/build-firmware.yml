name: Build firmware

on:
  workflow_call:
    inputs:
      device:
        required: true
        type: string
      config_url:
        type: string
        default: ''
      ssh:
        type: boolean
        default: false
    secrets:
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

permissions:
  contents: read

env:
  UPLOAD_BIN_DIR: false
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # OpenWrt ccache
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      DEVICE: ${{ inputs.device }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select firmware profile
        run: |
          case "$DEVICE" in
            ap8220)
              repo_url=https://github.com/immortalwrt/immortalwrt.git
              repo_tag=v25.12.2
              config_file=.config
              target=qualcommax
              subtarget=ipq807x
              profile=aliyun_ap8220
              ;;
            cm520)
              repo_url=https://github.com/immortalwrt/immortalwrt.git
              repo_tag=v25.12.2
              config_file=configs/cm520.config
              target=ipq40xx
              subtarget=generic
              profile=mobipromo_cm520-79f
              ;;
            be6l-pro)
              repo_url=https://github.com/x-wrt/x-wrt.git
              repo_tag=26.10_b202611040756
              config_file=configs/be6l-pro.config
              target=airoha
              subtarget=an7563
              profile=tenda_be6l-pro
              ;;
            *)
              echo "::error::Unknown firmware device."
              exit 1
              ;;
          esac

          {
            echo "REPO_URL=$repo_url"
            echo "REPO_TAG=$repo_tag"
            echo "CONFIG_FILE=$config_file"
            echo "TARGET_BOARD=$target"
            echo "TARGET_SUBTARGET=$subtarget"
            echo "TARGET_PROFILE=$profile"
          } >> "$GITHUB_ENV"

      - name: 1) Create OpenWrt build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            genisoimage git gperf haveged help2man intltool \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-setuptools rsync \
            scons squashfs-tools subversion swig texinfo node-uglify upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: 2) Download OpenWrt source code
        run: |
          git clone --depth 1 --branch "$REPO_TAG" "$REPO_URL" openwrt
          test "$(git -C openwrt rev-parse HEAD)" = "$(git -C openwrt rev-parse "refs/tags/$REPO_TAG^{commit}")"
          git -C openwrt log --oneline -1

      - name: 3) Get pre-build resources feeds
        run: |
          if [ "$DEVICE" = ap8220 ] && [ -f feeds.conf.default ]; then
            cp feeds.conf.default openwrt/feeds.conf.default
          fi

          cd openwrt
          if [ "$DEVICE" = ap8220 ] && [ -f "$GITHUB_WORKSPACE/diy-part1.sh" ]; then
            bash "$GITHUB_WORKSPACE/diy-part1.sh"
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4) Apply custom source modifications and config
        env:
          CONFIG_URL: ${{ inputs.config_url }}
        run: |
          if [ "$DEVICE" = ap8220 ]; then
            if [ -d files ]; then
              cp -r files openwrt/files
            fi
            if [ -d custom ]; then
              rsync -a custom/ openwrt/
            fi
          fi

          cp "$CONFIG_FILE" openwrt/.config
          if [ -n "$CONFIG_URL" ]; then
            config_download="$(mktemp)"
            trap 'rm -f "$config_download"' EXIT
            if curl -fsSL --proto '=https' --proto-redir '=https' --url "$CONFIG_URL" -o "$config_download"; then
              cp "$config_download" openwrt/.config
            else
              echo "::warning::config_url download failed, using $CONFIG_FILE."
            fi
          fi

          cd openwrt
          mkdir -p dl
          if [ "$DEVICE" = ap8220 ] && [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ]; then
            bash "$GITHUB_WORKSPACE/diy-part2.sh"
          fi

      - name: 5) Normalize and validate the device config
        run: |
          cd openwrt
          printf '\nCONFIG_CCACHE=y\n' >> .config
          make defconfig

          if ! grep -Fxq "CONFIG_TARGET_${TARGET_BOARD}_${TARGET_SUBTARGET}_DEVICE_${TARGET_PROFILE}=y" .config ||
             ! grep -Fxq "CONFIG_TARGET_PROFILE=\"DEVICE_${TARGET_PROFILE}\"" .config; then
            echo "::error::The effective .config must select $TARGET_BOARD/$TARGET_SUBTARGET/$TARGET_PROFILE."
            exit 1
          fi

          mkdir -p dl .ccache
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=' .config
          sha256sum .config

      - name: Generate cache metadata
        id: cache_meta
        run: |
          cd openwrt
          openwrt_commit="$(git rev-parse HEAD)"
          echo "openwrt_commit=$openwrt_commit" >> "$GITHUB_OUTPUT"
          echo "openwrt_commit=$openwrt_commit"
          for feed in feeds/*/.git; do
            [ -d "$feed" ] || continue
            feed_dir="${feed%/.git}"
            printf '%s=%s\n' "$feed_dir" "$(git -C "$feed_dir" rev-parse HEAD)"
          done

      - name: Restore downloads dl cache
        id: cache_dl
        uses: actions/cache/restore@v5
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ inputs.device }}-${{ hashFiles('openwrt/.config', 'openwrt/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ inputs.device }}-
            ${{ runner.os }}-openwrt-dl-

      - name: Restore tools and toolchain cache
        id: cache_toolchain
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host*
            openwrt/build_dir/toolchain-*
          key: ${{ runner.os }}-${{ runner.arch }}-openwrt-toolchain-${{ inputs.device }}-${{ steps.cache_meta.outputs.openwrt_commit }}-${{ hashFiles('openwrt/.config', 'openwrt/feeds.conf.default') }}

      - name: Restore ccache
        id: cache_ccache
        uses: actions/cache/restore@v5
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-openwrt-ccache-${{ inputs.device }}-${{ steps.cache_meta.outputs.openwrt_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-openwrt-ccache-${{ inputs.device }}-${{ steps.cache_meta.outputs.openwrt_commit }}-
            ${{ runner.os }}-${{ runner.arch }}-openwrt-ccache-${{ inputs.device }}-

      - name: Optional SSH debug
        uses: P3TERX/ssh2actions@v1.0.0
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.ssh == true) || contains(github.event.action || '', 'ssh') }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: 6) Download source archives
        run: |
          cd openwrt

          make download -j8

          # Remove obviously broken/incomplete downloads.
          find dl -size -1024c -exec rm -f {} \;

      - name: Save downloads dl cache
        if: steps.cache_dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: openwrt/dl
          key: ${{ steps.cache_dl.outputs.cache-primary-key }}

      - name: 7) Build tools and toolchain
        run: |
          cd openwrt

          echo "ccache location: $CCACHE_DIR"
          ccache -s || true

          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

          ccache -s || true

      - name: Save tools and toolchain cache
        if: steps.cache_toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host*
            openwrt/build_dir/toolchain-*
          key: ${{ steps.cache_toolchain.outputs.cache-primary-key }}

      - name: 8) Build firmware with existing config
        run: |
          cd openwrt

          echo "ccache location: $CCACHE_DIR"
          ccache -s || true

          # Build. If parallel build fails, retry serial with verbose log.
          make -j"$(nproc)" || make -j1 V=s

          ccache -s || true

      - name: Save ccache
        if: always() && steps.cache_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: openwrt/.ccache
          key: ${{ steps.cache_ccache.outputs.cache-primary-key }}

      - name: Collect build output info
        id: build_meta
        run: |
          cd openwrt

          DEVICE_NAME="_$TARGET_PROFILE"
          FILE_DATE="_$(date +"%Y%m%d%H%M")"
          FIRMWARE_DIR="$PWD/bin/targets/$TARGET_BOARD/$TARGET_SUBTARGET"

          if [ ! -d "$FIRMWARE_DIR" ] ||
             [ -z "$(find "$FIRMWARE_DIR" -maxdepth 1 -type f -name "*${TARGET_PROFILE}*-sysupgrade.bin" -size +0c -print -quit)" ]; then
            echo "::error::Sysupgrade image for $TARGET_PROFILE not found."
            exit 1
          fi

          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "file_date=$FILE_DATE" >> "$GITHUB_OUTPUT"
          echo "firmware_dir=$FIRMWARE_DIR" >> "$GITHUB_OUTPUT"

          echo "Firmware directory: $FIRMWARE_DIR"
          find "$FIRMWARE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 7) Upload firmware to GitHub Actions artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt_firmware${{ steps.build_meta.outputs.device_name }}${{ steps.build_meta.outputs.file_date }}
          path: ${{ steps.build_meta.outputs.firmware_dir }}
          if-no-files-found: error

      - name: Upload full bin directory optional
        if: env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt_bin${{ steps.build_meta.outputs.device_name }}${{ steps.build_meta.outputs.file_date }}
          path: openwrt/bin
          if-no-files-found: error
